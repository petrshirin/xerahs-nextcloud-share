; Настройки nc-share — читаются при каждом запуске, пересобирать не нужно

; Адрес Nextcloud, например https://cloud.example.com
Server =

; Папка в Nextcloud: значение dir= из адресной строки, например /Screenshots. Без сервера и папки доступно только
; копирование в буфер
BaseFolder =
PublicDir = public
TeamDir = team

; Сроки публичной ссылки в днях — по пункту меню на каждый
PublicDays = 1, 7, 30

; Что копировать для публичной ссылки: /preview — сама картинка, пусто — страница Nextcloud, /download — скачивание
PublicLinkSuffix = /preview

; Сколько секунд показывать уведомление
ToastSeconds = 4
