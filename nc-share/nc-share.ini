; Настройки nc-share — читаются при каждом запуске, пересобирать не нужно. Сервер и папку задаёт установщик

; Адрес Nextcloud, например https://cloud.example.com (если Nextcloud стоит в подкаталоге — вместе с ним)
Server =

; Папка в Nextcloud: значение dir= из адресной строки, например /Screenshots. Если её нет, создаётся при первой
; загрузке. Без сервера и папки доступно только копирование в буфер
BaseFolder =

; Путь внутри BaseFolder: {type} — папка по типу файла, {access} — по виду ссылки, %y и %mo — год и месяц.
; Пример: /Screenshots/screenshots/team/2026/10/…
PathTemplate = {type}/{access}/%y/%mo
ImagesDir = screenshots
VideosDir = videos
FilesDir = files
TeamDir = team
PublicDir = public

; Сроки публичной ссылки в днях — по пункту меню на каждый
PublicDays = 1, 7, 30

; Что копировать для публичной ссылки: /preview — сама картинка, пусто — страница Nextcloud, /download — скачивание
PublicLinkSuffix = /preview

; То же для видео и прочих файлов: /preview у видео — только кадр, а страница Nextcloud показывает плеер
FilePublicLinkSuffix =

; Сколько секунд показывать уведомление
ToastSeconds = 4
